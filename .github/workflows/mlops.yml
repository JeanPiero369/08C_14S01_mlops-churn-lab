name: MLOps Pipeline - Churn Predictor

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'data/**'
      - 'app/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/mlops.yml'
  workflow_dispatch:
    inputs:
      model_type:
        description: 'Tipo de modelo a entrenar'
        required: false
        default: 'logistic'
        type: choice
        options: [logistic, random_forest, xgboost]

env:
  MLFLOW_TRACKING_URI: ./mlruns
  EXPERIMENT_NAME: churn-prediction-fintech

jobs:

  # ── 1. Quality Gate ────────────────────────────────────────────────────────
  test:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ejecutar tests
        run: pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

  # ── 2. Data Pipeline ───────────────────────────────────────────────────────
  data-prep:
    name: Data Preparation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Preparar datos
        run: python src/data_prep.py
      - name: Subir artefactos de datos
        uses: actions/upload-artifact@v4
        with:
          name: data-prep-artifacts
          path: data/

  # ── 3. Train Model + Experiment Tracking ──────────────────────────────────
  train:
    name: Modeling
    runs-on: ubuntu-latest
    needs: data-prep
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Descargar artefactos de datos
        uses: actions/download-artifact@v4
        with:
          name: data-prep-artifacts
          path: data/
      - name: Entrenar modelo
        run: |
          python src/train.py \
            --model ${{ github.event.inputs.model_type || 'all' }} \
            --experiment ${{ env.EXPERIMENT_NAME }}
      - name: Subir artefactos de MLflow
        uses: actions/upload-artifact@v4
        with:
          name: train-artifacts
          path: |
            mlruns/
            data/

  # ── 4. Model Registry ──────────────────────────────────────────────────────
  register:
    name: Evaluation
    runs-on: ubuntu-latest
    needs: train
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Descargar artefactos de datos
        uses: actions/download-artifact@v4
        with:
          name: data-prep-artifacts
          path: data/
      - name: Descargar artefactos de MLflow
        uses: actions/download-artifact@v4
        with:
          name: train-artifacts
          path: .
      - name: Evaluar y registrar modelo
        run: python src/evaluate_and_register.py
      - name: Subir modelo de producción
        uses: actions/upload-artifact@v4
        with:
          name: production-artifacts
          retention-days: 30
          path: data/
      - name: Resumen de métricas
        run: |
          if [ -f data/best_model_meta.json ]; then
            echo "## Métricas del Modelo" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat data/best_model_meta.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  # ── 5. Smoke Test ───────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: register
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Descargar modelo de producción
        uses: actions/download-artifact@v4
        with:
          name: production-artifacts
          path: data/
      - name: Verificar que la API arranca con el modelo
        run: |
          cd app
          timeout 15 uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 8
          curl -f http://localhost:8000/health    || exit 1
          curl -f http://localhost:8000/model/info || exit 1
          echo "Smoke test OK"
